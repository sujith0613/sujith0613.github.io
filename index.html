<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sujith M — Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #111;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
    }

    img.profile {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 24px;
      opacity: 0;
      transform: scale(0.96);
      animation: fadeImage 0.8s ease-out forwards;
    }

    @keyframes fadeImage {
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 8px;
      opacity: 0;
      transform: translateY(6px);
      animation: fadeTitle 0.8s ease-out forwards;
      animation-delay: 0.2s;
    }

    @keyframes fadeTitle {
      to { opacity: 1; transform: translateY(0); }
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      max-width: 520px;
      margin: 0 auto 48px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      text-decoration: none;
      color: #111;
      font-size: 0.9rem;
      background: #fafafa;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .links a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      background: #ffffff;
    }

    .icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .quote {
      font-size: 1.05rem;
      color: #374151;
      margin: 24px auto 36px;
      max-width: 560px;
      min-height: 48px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeQuote 1.2s ease-out forwards;
      animation-delay: 0.6s;
    }

    @keyframes fadeQuote {
      to { opacity: 1; transform: translateY(0); }
    }

    .quote.font-1 { font-family: Georgia, serif; color: #374151; }
    .quote.font-2 { font-family: "Courier New", monospace; color: #1f2937; }
    .quote.font-3 { font-family: "Trebuchet MS", sans-serif; color: #111827; }
    .quote.font-4 { font-family: "Times New Roman", serif; color: #4b5563; }

    .cursor {
      display: inline-block;
      margin-left: 2px;
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      to { visibility: hidden; }
    }

    .passion {
      font-size: 0.95rem;
      color: #333;
      max-width: 520px;
      margin: 0 auto;
    }

    footer {
      margin-top: 80px;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="profile.jpg" alt="Sujith M" class="profile">
    <h1>Sujith M</h1>

    <div class="links">
      <a href="projects.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16v4H4zM4 10h16v10H4z"/></svg>
        Projects
      </a>

        <svg class="icon" viewBox="0 0 24 24"><path d="M12 .5a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.4-1.34-1.77-1.34-1.77-1.09-.74.08-.73.08-.73 1.2.09 1.83 1.23 1.83 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.78.42-1.3.76-1.6-2.67-.31-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.24-3.22-.12-.31-.54-1.56.12-3.25 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.69.24 2.94.12 3.25.77.84 1.24 1.91 1.24 3.22 0 4.62-2.81 5.63-5.49 5.94.43.37.82 1.1.82 2.22v3.29c0 .32.22.69.82.58A12 12 0 0 0 12 .5z"/></svg>
        GitHub
      </a>
      <a href="https://www.linkedin.com/in/sujith-m-1b0b92322/" target="_blank">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4.98 3.5A2.5 2.5 0 1 1 5 8.5a2.5 2.5 0 0 1-.02-5zM3 9h4v12H3zM9 9h3.8v1.6h.1c.5-.9 1.8-1.8 3.7-1.8 4 0 4.7 2.6 4.7 6v6.2h-4V15c0-1.4 0-3.2-2-3.2s-2.3 1.5-2.3 3.1v6.3H9z"/></svg>

      </a>

        Email
      </a>
    </div>

    <div class="quote"><span id="typed-quote"></span><span class="cursor">|</span></div>

    <div class="passion">
      Interested in understanding systems deeply and turning ideas into working software.
    </div>

    <footer>
      © 2025 Sujith M. All rights reserved.
    </footer>
  </div>

  <script>
    const quotes = [
      "Clarity comes from building, breaking, and rebuilding systems.",
      "Think in systems. Code with purpose.",
      "Small abstractions. Big impact.",
      "Engineering is applied thinking."
    ];

    const fonts = ['font-1', 'font-2', 'font-3', 'font-4'];
    const el = document.getElementById('typed-quote');
    const container = document.querySelector('.quote');

    let q = 0;
    let i = 0;
    let deleting = false;

    function typeLoop() {
      const text = quotes[q];
      if (!deleting) {
        el.textContent = text.slice(0, i++);
        if (i > text.length + 12) deleting = true;
      } else {
        el.textContent = text.slice(0, i--);
        if (i === 0) {
          deleting = false;
          q = (q + 1) % quotes.length;
          container.className = 'quote ' + fonts[q % fonts.length];
        }
      }
      setTimeout(typeLoop, deleting ? 40 : 70);
    }

    container.classList.add(fonts[0]);
    typeLoop();
  </script>
</body>
</html>
